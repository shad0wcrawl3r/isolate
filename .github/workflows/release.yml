name: Sign and release

# Push a tag matching the manifest version (e.g. v1.4.0) to sign the
# extension on AMO as unlisted (private, self-distributed) and attach the
# signed .xpi to a GitHub release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check tag matches manifest version
        run: |
          version=$(jq -r .version manifest.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi

      # Only these files ship in the extension.
      - name: Stage extension files
        run: |
          mkdir dist
          cp manifest.json background.js suppress.css dist/

      - name: Lint
        run: npx --yes web-ext@8 lint --source-dir dist

      - name: Sign on AMO (unlisted)
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          npx --yes web-ext@8 sign \
            --source-dir dist \
            --artifacts-dir web-ext-artifacts \
            --channel unlisted

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" web-ext-artifacts/*.xpi \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
