name: Sign and release

# Push a tag matching the manifest version (e.g. v1.5.0) to submit the
# extension to addons.mozilla.org (public listing) and create a GitHub
# release. Users install and update from AMO, so no .xpi is attached.
on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  sign:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Actions are pinned to commit SHAs because this job holds the AMO keys.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Check tag matches manifest version
        run: |
          version=$(jq -r .version manifest.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi

      # Only these files ship in the extension.
      - name: Stage extension files
        run: |
          mkdir -p dist/icons
          cp manifest.json background.js suppress.css dist/
          cp icons/icon.svg dist/icons/

      - name: Lint
        run: npx --yes web-ext@8.10.0 lint --source-dir dist

      - name: Submit to AMO
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          npx --yes web-ext@8.10.0 sign \
            --source-dir dist \
            --artifacts-dir web-ext-artifacts \
            --channel listed \
            --amo-metadata amo-metadata.json \
            --approval-timeout 0

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
